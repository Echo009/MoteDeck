<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">新增支持小米遥控器2 与谷歌 TV 遥控器</title>
  <desc id="d">MoteDeck 0.1.9 起同时支持小米遥控器2（RC001）与 Google TV 款的谷歌遥控器（Chromecast）：按键走蓝牙 HID，语音走蓝牙 GATT 私有服务，按住话筒键录音、松手发送。谷歌 TV 遥控器均由第三方生产，存在多个版本，不能保证所有版本都可以使用。</desc>
  <defs>
    <linearGradient id="remoteBody" x1="0" y1="0" x2="84" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0EEE9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="18" fill="#EEEDEA"/>

  <text x="64" y="52" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" letter-spacing="1.6" fill="#6B6862">新增支持 · NEW DEVICE</text>
  <text x="1136" y="52" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" fill="#8A867F">MoteDeck 0.1.9</text>

  <!-- 小米遥控器2 -->
  <g transform="translate(64 96)">
    <rect width="74" height="112" rx="16" fill="url(#remoteBody)" stroke="#E2DFD8"/>
    <circle cx="18" cy="18" r="6" fill="none" stroke="#C9C5BD" stroke-width="2"/>
    <path d="M18 14v8M14 18h8" stroke="#111111" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="56" cy="18" r="6" fill="none" stroke="#C9C5BD" stroke-width="2"/>
    <rect x="54" y="15" width="4" height="6" rx="2" fill="#111111"/>
    <circle cx="37" cy="46" r="16" fill="none" stroke="#C9C5BD" stroke-width="2.5"/>
    <circle cx="37" cy="46" r="6" fill="#111111"/>
    <rect x="20" y="70" width="14" height="7" rx="3.5" fill="#111111"/>
    <rect x="40" y="70" width="14" height="7" rx="3.5" fill="#111111"/>
    <rect x="20" y="82" width="14" height="7" rx="3.5" fill="#111111"/>
    <rect x="40" y="82" width="14" height="7" rx="3.5" fill="#111111"/>
    <rect x="20" y="94" width="14" height="7" rx="3.5" fill="#111111"/>
    <rect x="40" y="94" width="14" height="7" rx="3.5" fill="#111111"/>
  </g>

  <!-- 谷歌 TV 遥控器 -->
  <g transform="translate(152 96)">
    <rect width="58" height="112" rx="18" fill="url(#remoteBody)" stroke="#E2DFD8"/>
    <circle cx="29" cy="34" r="18" fill="none" stroke="#C9C5BD" stroke-width="2.5"/>
    <circle cx="29" cy="34" r="7" fill="#111111"/>
    <rect x="26" y="64" width="6" height="10" rx="3" fill="#111111"/>
    <path d="M22 72a7 7 0 0 0 14 0" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
    <rect x="15" y="88" width="28" height="7" rx="3.5" fill="#B9B5AD"/>
    <rect x="15" y="99" width="28" height="7" rx="3.5" fill="#B9B5AD"/>
  </g>

  <text x="240" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="30" font-weight="600" letter-spacing="-0.3" fill="#111111">小米遥控器2</text>
  <text x="240" y="172" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#6B6862">Xiaomi RC001 · 13 键</text>

  <text x="240" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="30" font-weight="600" letter-spacing="-0.3" fill="#111111">谷歌 TV 遥控器</text>
  <text x="240" y="246" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#6B6862">Chromecast · 第三方厂商</text>

  <line x1="640" y1="150" x2="900" y2="150" stroke="#B9B5AD" stroke-width="2"/>
  <path d="M912 150 L900 144 L900 156 Z" fill="#B9B5AD"/>

  <rect x="700" y="128" width="236" height="44" rx="22" fill="#111111"/>
  <text x="818" y="156" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="18" fill="#FFFFFF">蓝牙直连 · 语音直传</text>

  <text x="1136" y="138" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="34" font-weight="600" letter-spacing="-0.3" fill="#111111">MoteDeck</text>
  <text x="1136" y="176" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" fill="#6B6862">小米 / 谷歌 双遥控器</text>

  <text x="600" y="272" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="17" fill="#55524C">谷歌 TV 遥控器由第三方生产，存在多个版本，不能保证所有版本都可以使用</text>
</svg>
