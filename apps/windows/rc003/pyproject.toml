[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motedeck"
version = "0.2.3"
description = "Remote Mic - Xiaomi RC003 Windows client (partially real-device-verified source/build candidate)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }

[tool.setuptools.packages.find]
where = ["src"]
